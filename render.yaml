services:
  - type: web
    name: insightport
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FB_USER_TOKEN
        sync: false   # prompted in the Render dashboard, never stored in git
      # Optional: add APP_PASSWORD in the Render dashboard (Environment tab)
      # to put the app behind a password. Unset = open access.
